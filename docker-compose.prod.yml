# Production stack for suethemchickens.online.
#
# Differences from docker-compose.yml (the local-dev stack):
#   - Pulls pre-built images from GHCR (built by .github/workflows/docker.yml) instead
#     of building from source on the host.
#   - No LLM service — the annual-report/decision-gen features degrade invisibly
#     without one (see llmService.ts), and running llama.cpp alongside Postgres/Node
#     on a small VPS isn't worth it yet. Add an `llm:` service back (copy it from
#     docker-compose.yml) if the box ever has RAM to spare.
#   - Postgres has no host port published — only reachable from other containers on
#     this compose network, never from the internet.
#   - Caddy terminates TLS (automatic Let's Encrypt) and is the only service with
#     published ports; server/client are only reachable through it.
#
# Required on the host before `docker compose -f docker-compose.prod.yml up -d`:
#   - A `.env` file next to this one (see .env.production.example) with
#     POSTGRES_PASSWORD, ADMIN_TOKEN, and IMAGE_TAG set.
#   - `Caddyfile` present in the same directory.
#
# Deploy sequence (see .github/workflows/docker.yml's `deploy` job for the automated
# version): pull images, run migrations via a throwaway `server` container, then bring
# everything up —
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml run --rm server npx prisma migrate deploy --schema=server/prisma/schema.prisma
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: stc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: stc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stc"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: ghcr.io/roistofin/suethemchickens/server:${IMAGE_TAG:-latest}
    container_name: stc-server
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://stc:${POSTGRES_PASSWORD}@postgres:5432/stc_db
      - PORT=3001
      - NODE_ENV=production
      - CLIENT_URL=https://suethemchickens.online,https://www.suethemchickens.online
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN must be set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    image: ghcr.io/roistofin/suethemchickens/client:${IMAGE_TAG:-latest}
    container_name: stc-client
    restart: unless-stopped
    environment:
      - SERVER_URL=http://server:3001
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: stc-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Access logs (see the `log` block in Caddyfile). A named volume, not stdout,
      # so logs survive the container being recreated on every deploy — referral
      # traffic from a marketing post is measured over days, across deploys.
      - caddy_logs:/var/log/caddy
    depends_on:
      - server
      - client

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
