name: Docker Build and Push

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'shared/**'
      - 'Dockerfile'
      - 'server/Dockerfile'
      - 'client/Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      # The deploy job scp's Caddyfile to the box (see the "Copy compose/Caddy config
      # to server" step), so a Caddyfile-only change MUST trigger this workflow —
      # without this line it silently wouldn't, and the box would keep serving the old
      # config with CI green and no error anywhere. Caddy is the TLS terminator and the
      # sole public entry point, so that failure mode is worth guarding explicitly.
      - 'Caddyfile'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The public URL the browser will actually load — baked into the client bundle at
  # build time (Vite env vars are compile-time only), see client/Dockerfile. Update
  # this if the domain ever changes.
  PUBLIC_URL: https://suethemchickens.online

jobs:
  # github.repository preserves the exact case of the GitHub owner/repo (roistoFIN has
  # an uppercase F), but Docker/GHCR image names must be all-lowercase — pushing
  # ghcr.io/roistoFIN/... fails outright ("invalid reference format"). Every job below
  # needs the lowercased form, so it's computed once here rather than three times.
  prep:
    runs-on: ubuntu-latest
    outputs:
      image_base: ${{ steps.lower.outputs.name }}
    steps:
      - name: Compute lowercase image base
        id: lower
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-server:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prep.outputs.image_base }}/server
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-client:
    needs: prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prep.outputs.image_base }}/client
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # ADSENSE_CLIENT_ID/GA_MEASUREMENT_ID/ADSENSE_SLOT_* are repo Variables (Settings →
      # Secrets and variables → Actions → Variables), not Secrets — all end up baked
      # verbatim into the public client bundle regardless, so there's nothing to protect
      # by hiding them from workflow logs. Unset is fine: see client/src/lib/
      # googleConsent.ts (script loaders) and client/src/components/AdSlot.tsx (ad units).
      - name: Build and push client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_SERVER_URL=${{ env.PUBLIC_URL }}
            VITE_ADSENSE_CLIENT_ID=${{ vars.ADSENSE_CLIENT_ID }}
            VITE_GA_MEASUREMENT_ID=${{ vars.GA_MEASUREMENT_ID }}
            VITE_ADSENSE_SLOT_LANDING=${{ vars.ADSENSE_SLOT_LANDING }}
            VITE_ADSENSE_SLOT_GAMEOVER=${{ vars.ADSENSE_SLOT_GAMEOVER }}
            VITE_ADSENSE_SLOT_RULES=${{ vars.ADSENSE_SLOT_RULES }}
            VITE_ADSENSE_SLOT_STRATEGY=${{ vars.ADSENSE_SLOT_STRATEGY }}
            VITE_ADSENSE_SLOT_GLOSSARY=${{ vars.ADSENSE_SLOT_GLOSSARY }}
            VITE_ADSENSE_SLOT_DEVLOG=${{ vars.ADSENSE_SLOT_DEVLOG }}
            VITE_ADSENSE_SLOT_HOWTOPLAY=${{ vars.ADSENSE_SLOT_HOWTOPLAY }}
            VITE_ADSENSE_SLOT_WHATSNEW=${{ vars.ADSENSE_SLOT_WHATSNEW }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose/Caddy config to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "/opt/suethemchickens"
          strip_components: 0

      - name: Pull images, migrate, and restart the stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd /opt/suethemchickens
            export IMAGE_TAG=${GITHUB_SHA:0:7}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml run --rm server npx prisma migrate deploy --schema=server/prisma/schema.prisma
            docker compose -f docker-compose.prod.yml run --rm server npx tsx server/prisma/seed.ts
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          GITHUB_SHA: ${{ github.sha }}
